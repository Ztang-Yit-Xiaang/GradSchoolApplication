[project]
name = "gradpath-planner"
version = "0.1.0"
description = "Local Streamlit MVP for graduate school hunting and preparation."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "openai>=1.0",
    "pandas>=2.0",
    "pypdf>=4.0",
    "requests>=2.31",
    "streamlit>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
